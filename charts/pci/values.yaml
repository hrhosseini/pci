# Default values for PolicyChangeImpact (PCI).
# Public install:
#   helm install pci oci://ghcr.io/hrhosseini/charts/pci --version 0.1.0 \
#     -n pci-system --create-namespace

replicaCount: 1
# SQLite is single-writer. Do not raise replicaCount above 1 unless you change
# storage to a shared database design that this chart does not provide.

image:
  repository: ghcr.io/hrhosseini/pci
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# rbac.scope: cluster | namespace
# cluster grants ClusterRole for all-namespace discovery (default for product install).
# namespace limits Role to rbac.namespaces (or release namespace when empty).
rbac:
  create: true
  scope: cluster
  namespaces: []

podAnnotations: {}
podLabels:
  app.kubernetes.io/component: api

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pci.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Persistence for SQLite (analyses, snapshots, evidence). Required for durable data.
persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /var/lib/pci

# Application configuration (rendered into Deployment env / ConfigMap).
config:
  address: "0.0.0.0"
  port: "8080"
  kubeMode: in-cluster
  allNamespaces: true
  namespace: default
  staticDir: /app/ui
  dataDir: /var/lib/pci/pci.db
  allowNonLoopback: "1"
  # Optional overrides; leave empty for in-cluster ServiceAccount auth.
  kubeconfigPath: ""
  kubeContext: ""

# Optional NetworkPolicy for the PCI pod (ingress from same namespace only by default).
networkPolicy:
  enabled: false
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
