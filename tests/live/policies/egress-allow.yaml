apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pci-phase6-egress-allow
  namespace: pci-phase6-source
  labels:
    pci-phase6-owner: PCI_RUN_ID
spec:
  podSelector:
    matchLabels: {app: client}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {pci-phase6-role: destination}
          podSelector:
            matchLabels: {app: server}
      ports:
        - {protocol: TCP, port: 80}
